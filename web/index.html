<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Electronic Medical Record (EMR) System adalah sistem digital untuk mencatat, menyimpan, dan mengelola data rekam medis pasien secara aman dan terintegrasi.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="emr_system">
  <link rel="apple-touch-icon" href="icons/emr-icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/emr-favicon.png"/>

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#2196F3">

  <title>Electronic Medical Record</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #E3F2FD; /* biru muda */
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }
  
    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border: 15px solid;
      border-top: 16px solid #E3F2FD; /* biru muda */
      border-right: 16px solid #2196F3; /* biru utama */
      border-bottom: 16px solid #E3F2FD; /* biru muda */
      border-left: 16px solid #2196F3; /* biru utama */
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
    }
  
    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
  
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    var serviceWorkerVersion = '{{flutter_service_worker_version}}';
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="loading">
    <div class="loader"></div>
  </div>  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
